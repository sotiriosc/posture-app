name: CI

on:
  pull_request:
  schedule:
    # Nightly full suite at 07:00 UTC
    - cron: "0 7 * * *"

jobs:
  # ─── PR gate ──────────────────────────────────────────────────────────────
  # Runs on every pull request. Fast enough to be a blocking gate (target:
  # under 3 minutes — see Phase 6f Commit 6 / ED-6f.8 in
  # docs/engine-decisions.md for how this set was chosen).
  pr-gate:
    name: PR gate (lint + critical tests + smoke e2e + both builds)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Boundary lint (R2/R3/R4) ──────────────────────────────────────────
      - name: Boundary lint
        run: >-
          npx eslint
          packages/engine/src
          apps/consumer/src
          apps/gyms/src

      # ── Critical (@critical) engine suite: golden/identity/determinism
      # anchors, catalog + ladder invariants, feedback contract, subscription
      # and offline-sync logic touched by recent phases. See
      # `test:critical` in package.json for the exact file list.
      - name: Critical engine tests
        run: npm run test:critical

      # ── Playwright smoke: first-run happy path + per-account isolation,
      # for both apps. Blocking per bloom-plan Phase 6f Commit 6.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (consumer)
        run: npm run test:e2e:smoke:consumer

      - name: Playwright smoke (gyms)
        run: npm run test:e2e:smoke:gyms

      # ── Both apps build ───────────────────────────────────────────────────
      - name: Build consumer app
        run: npm run build --workspace=apps/consumer

      - name: Build gyms app
        run: npm run build --workspace=apps/gyms

  # ─── Phase 7 program-quality gate (blocking, parallel) ────────────────────
  quality-core:
    name: quality-core
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused quality-gate tests
        run: >-
          npx vitest run --config packages/engine/vitest.config.ts
          packages/engine/tests/unit/programQualityGate.test.ts
      - name: Coverage matrix (includes resolved gym 5d pain baseline)
        run: npm run audit:coverage-matrix

  quality-gym:
    name: quality-gym
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gym 10k fuzz + contract
        run: npm run audit:gym-program
        env:
          GYM_FUZZ_CASES: "10000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gym-reports
          path: docs/dev-reports/equipment-program-audit-phase2*

  quality-dumbbells:
    name: quality-dumbbells
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dumbbell 10k fuzz + contract
        run: npm run audit:dumbbell-program
        env:
          DUMBBELL_FUZZ_CASES: "10000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-dumbbell-reports
          path: docs/dev-reports/equipment-program-audit-phase3*

  quality-bands:
    name: quality-bands
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Band 10k fuzz + contract
        run: npm run audit:band-program
        env:
          BAND_FUZZ_CASES: "10000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-band-reports
          path: docs/dev-reports/equipment-program-audit-phase4*

  quality-bodyweight:
    name: quality-bodyweight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bodyweight 10k fuzz + contract
        run: npm run audit:bodyweight-program
        env:
          BODYWEIGHT_FUZZ_CASES: "10000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-bodyweight-reports
          path: docs/dev-reports/equipment-program-audit-phase5*

  quality-mixed-home:
    name: quality-mixed-home
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mixed-home 10k fuzz + contract
        run: npm run audit:mixed-home-program
        env:
          MIXED_HOME_FUZZ_CASES: "10000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-mixed-home-reports
          path: docs/dev-reports/equipment-program-audit-phase5b*

  quality-coaching:
    name: quality-coaching
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exercise coaching audit
        run: npm run audit:exercise-coaching

  quality-builds:
    name: quality-builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build consumer app
        run: npm run build --workspace=apps/consumer
      - name: Build gyms app
        run: npm run build --workspace=apps/gyms

  # ─── Nightly full suite ───────────────────────────────────────────────────
  # Runs on schedule only. Heavier — allows the full (@full) suite to run,
  # unchanged in scope from before Phase 6f's categorization pass.
  full-suite:
    name: Full engine suite (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full engine suite
        run: npm run test:full

      # Gyms-only tests run nightly too.
      - name: Run gyms suite
        run: npm run test:full:gyms

      # Consumer-only tests (e.g. macro calculator math, Phase 6f Commit 9).
      - name: Run consumer suite
        run: npm run test:full:consumer
